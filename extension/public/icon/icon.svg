<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Redact">
  <!-- rounded red square -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#dc2626"/>

  <!-- white R, drawn as a clean path: stem + rounded bowl + diagonal leg -->
  <path
    d="
      M 32 32
      L 32 100
      L 50 100
      L 50 74
      L 60 74
      L 84 100
      L 102 100
      L 76 72
      C 92 70, 100 60, 100 52
      C 100 38, 90 32, 76 32
      Z
      M 50 46
      L 76 46
      C 82 46, 84 49, 84 52
      C 84 56, 82 60, 76 60
      L 50 60
      Z
    "
    fill="#ffffff"
    fill-rule="evenodd"
  />

  <!-- thin black redaction bar across the bottom of the icon — symbolic of "redacted" -->
  <rect x="32" y="108" width="64" height="10" rx="2" fill="#0a0a0a"/>
</svg>
